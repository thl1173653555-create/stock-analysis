# 默认研究参数；CLI 与看板缺省值来源于此，代码内逻辑默认值为回落。
# 注意：看板侧栏的交互输入仍会覆盖这里的值。
# start_date 决定回测起点；日线缓存保存全历史，首次使用更早起点时会自动补拉。

symbols = ["002463", "600519", "000001", "300750", "600036"]
start_date = "20210101"

stock_commission = 0.0003
stock_stamp_duty = 0.0005
etf_commission = 0.0003

fast = 20
slow = 60

scan_fasts = [5, 10, 15, 20, 30, 50]
scan_slows = [60, 90, 120, 150, 200]

init_cash = 100000
# 止损比例：0 表示关闭；0.08 表示跌破买入价 8% 后下一交易日收盘卖出
stop_loss = 0.0

# 基准指数（留空关闭），默认沪深300
benchmark = "000300"

# 数据更新：并发线程数与每个数据源重试次数
update_workers = 4
update_retries = 2

# 信号变化提醒 webhook（Server酱/钉钉/自定义机器人均可；留空不发送）
notify_url = ""
